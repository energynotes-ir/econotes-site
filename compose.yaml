services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ECONOTES_DB: /data/econotes.db
    volumes:
      - ${ECONOTES_DATA_DIR:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  refresh:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "api.app.refresh_data"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ECONOTES_DB: /data/econotes.db
    volumes:
      - ${ECONOTES_DATA_DIR:-./data}:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-econotes.ir}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
